<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Factory Tycoon | HUD Overlay Interface</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        /* ===== FOND ANIMÉ QUANTIQUE ===== */
        #quantum-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(10, 5, 30, 0.9) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(30, 10, 50, 0.9) 0%, transparent 40%),
                linear-gradient(135deg, #0a051e 0%, #120b2e 50%, #0a051e 100%);
        }

        .quantum-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
            animation: float 15s infinite linear;
        }

        /* ===== CANVAS PRINCIPAL ===== */
        #game-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ===== HUD OVERLAY PRINCIPAL ===== */
        #hud-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        /* ===== HUD SUPERPOSÉ : COUCHE SUPÉRIEURE ===== */
        .hud-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Couche 1 : Éléments d'interface fixes */
        #hud-fixed {
            z-index: 101;
        }

        /* Couche 2 : Éléments contextuels */
        #hud-contextual {
            z-index: 102;
        }

        /* Couche 3 : Éléments temporaires (notifications, alertes) */
        #hud-temporary {
            z-index: 103;
        }

        /* Couche 4 : Éléments interactifs (menus) */
        #hud-interactive {
            z-index: 104;
            pointer-events: auto;
        }

        /* ===== BARRE DE RESSOURCES SUPÉRIEURE ===== */
        #resource-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(5, 10, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            padding: 15px 25px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 30px rgba(0, 243, 255, 0.2);
        }

        .resource-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: rgba(0, 20, 40, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            min-width: 140px;
            transition: all 0.3s ease;
        }

        .resource-item:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 243, 255, 0.6);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .resource-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 10px;
            font-size: 20px;
            color: #00f3ff;
        }

        .resource-info {
            flex: 1;
        }

        .resource-name {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2px;
        }

        .resource-value {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px currentColor;
        }

        .resource-rate {
            font-size: 11px;
            color: #00ff9d;
            margin-top: 2px;
        }

        /* ===== BARRE DE SANTÉ DES SYSTÈMES ===== */
        #system-health {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 300px;
        }

        .system-bar {
            background: rgba(5, 10, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .system-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 8px;
            font-size: 18px;
            color: #00f3ff;
        }

        .system-info {
            flex: 1;
        }

        .system-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .system-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .system-value {
            font-size: 12px;
            font-weight: 700;
            color: #00ff9d;
        }

        .progress-bar {
            height: 6px;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease, background 0.3s ease;
        }

        /* ===== BARRE D'ACTIONS INFÉRIEURE ===== */
        #action-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(5, 10, 25, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .action-btn {
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 243, 255, 0.6);
            background: rgba(0, 40, 80, 0.8);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.3);
        }

        .action-btn i {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .action-btn span {
            font-size: 11px;
            font-weight: 600;
        }

        /* ===== PANEL LATERAL D'INFORMATIONS ===== */
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(5, 10, 25, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            color: #00f3ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-item {
            background: rgba(0, 20, 40, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: rgba(0, 243, 255, 0.3);
            transform: translateX(2px);
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        /* ===== WIDGETS FLOTTANTS ===== */
        .hud-widget {
            position: absolute;
            background: rgba(5, 10, 25, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .widget-minimize {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 243, 255, 0.1);
            border-radius: 6px;
            color: #00f3ff;
            cursor: pointer;
            font-size: 12px;
        }

        /* Widget : Production Overview */
        #production-widget {
            top: 180px;
            left: 20px;
            width: 350px;
        }

        /* Widget : Alertes */
        #alerts-widget {
            bottom: 180px;
            right: 20px;
            width: 300px;
        }

        .alert-item {
            padding: 10px;
            background: rgba(255, 71, 87, 0.1);
            border-left: 3px solid #ff4757;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        /* Widget : Objectifs */
        #objectives-widget {
            bottom: 20px;
            left: 20px;
            width: 320px;
        }

        /* ===== RADIAL MENU ===== */
        #radial-menu {
            position: absolute;
            display: none;
            pointer-events: auto;
        }

        .radial-center {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(5, 10, 25, 0.95);
            border: 2px solid #00f3ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00f3ff;
            font-size: 20px;
            cursor: pointer;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
        }

        .radial-item {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(5, 10, 25, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-origin: center center;
        }

        .radial-item:hover {
            transform: scale(1.2);
            border-color: #00f3ff;
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        /* ===== CONSOLE HOLOGRAPHIQUE ===== */
        #holo-console {
            position: absolute;
            bottom: 30px;
            right: 350px;
            width: 400px;
            height: 200px;
            background: rgba(5, 10, 25, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            overflow-y: auto;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        .console-line {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .console-time {
            color: #00f3ff;
            margin-right: 10px;
        }

        /* ===== INDICATEURS DE STATUT ===== */
        .status-indicator {
            position: absolute;
            padding: 8px 15px;
            background: rgba(5, 10, 25, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .status-indicator:hover {
            transform: translateY(-2px);
        }

        #rank-indicator {
            top: 20px;
            right: 340px;
            border-color: #ffcc00;
            color: #ffcc00;
        }

        #time-indicator {
            top: 60px;
            right: 340px;
            border-color: #00ff9d;
            color: #00ff9d;
        }

        #fps-indicator {
            top: 100px;
            right: 340px;
            border-color: #8a2be2;
            color: #8a2be2;
        }

        /* ===== NOTIFICATIONS ===== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 300px;
            max-width: 400px;
            background: rgba(5, 10, 25, 0.95);
            backdrop-filter: blur(20px);
            border-left: 4px solid;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideInRight 0.3s ease, fadeOut 0.3s ease 4.7s forwards;
            pointer-events: auto;
        }

        .notification-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .notification-title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .notification-content {
            font-size: 12px;
            line-height: 1.4;
        }

        /* ===== TOOLTIPS ===== */
        .hud-tooltip {
            position: absolute;
            background: rgba(5, 10, 25, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            max-width: 250px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .tooltip-title {
            font-weight: 700;
            color: #00f3ff;
            margin-bottom: 5px;
        }

        .tooltip-content {
            color: rgba(255, 255, 255, 0.8);
        }

        /* ===== MENUS CONTEXTUELS ===== */
        .context-menu {
            position: absolute;
            background: rgba(5, 10, 25, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            padding: 8px;
            min-width: 200px;
            box-shadow: 
                0 15px 50px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            pointer-events: auto;
        }

        .menu-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: rgba(0, 243, 255, 0.1);
        }

        .menu-item i {
            width: 20px;
            color: #00f3ff;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(10px, -10px) rotate(90deg); }
            50% { transform: translate(0, 20px) rotate(180deg); }
            75% { transform: translate(-10px, 10px) rotate(270deg); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
            50% { box-shadow: 0 0 40px rgba(0, 243, 255, 0.8); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1600px) {
            #resource-bar { gap: 10px; padding: 12px 20px; }
            .resource-item { min-width: 120px; padding: 6px 12px; }
            #info-panel, #system-health { width: 280px; }
            .hud-widget { max-width: 300px; }
            #holo-console { width: 350px; }
        }

        @media (max-width: 1200px) {
            #resource-bar { flex-wrap: wrap; width: 90%; }
            .resource-item { min-width: 110px; }
            #action-bar { flex-wrap: wrap; width: 90%; justify-content: center; }
            .action-btn { width: 55px; height: 55px; }
        }

        /* ===== UTILITAIRES ===== */
        .text-gradient {
            background: linear-gradient(90deg, #00f3ff, #8a2be2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .glass-effect {
            background: rgba(5, 10, 25, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hologram-effect {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.1),
                inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        /* ===== MODES HUD ===== */
        .hud-mode-minimal .hud-widget,
        .hud-mode-minimal #info-panel,
        .hud-mode-minimal #holo-console {
            opacity: 0.3;
            transform: scale(0.95);
        }

        .hud-mode-minimal .hud-widget:hover,
        .hud-mode-minimal #info-panel:hover,
        .hud-mode-minimal #holo-console:hover {
            opacity: 1;
            transform: scale(1);
        }

        .hud-mode-immersive {
            opacity: 0.2;
        }

        .hud-mode-immersive:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Fond quantique animé -->
    <div id="quantum-bg"></div>

    <!-- Canvas de jeu -->
    <canvas id="game-canvas"></canvas>

    <!-- HUD Overlay Principal -->
    <div id="hud-overlay">
        <!-- Couche 1 : Éléments fixes -->
        <div class="hud-layer" id="hud-fixed">
            <!-- Barre de ressources supérieure -->
            <div id="resource-bar">
                <!-- Ressources générées dynamiquement -->
            </div>

            <!-- Barre de santé des systèmes -->
            <div id="system-health">
                <div class="system-bar">
                    <div class="system-icon">
                        <i class="fas fa-thermometer-half"></i>
                    </div>
                    <div class="system-info">
                        <div class="system-header">
                            <span class="system-name">Température</span>
                            <span class="system-value" id="heat-value">0°C</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="heat-bar" style="width: 0%; background: linear-gradient(90deg, #00ff9d, #ffcc00, #ff4757);"></div>
                        </div>
                    </div>
                </div>

                <div class="system-bar">
                    <div class="system-icon">
                        <i class="fas fa-tachometer-alt"></i>
                    </div>
                    <div class="system-info">
                        <div class="system-header">
                            <span class="system-name">Stabilité</span>
                            <span class="system-value" id="stability-value">100%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="stability-bar" style="width: 100%; background: linear-gradient(90deg, #00ff9d, #00f3ff);"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Indicateurs de statut -->
            <div class="status-indicator" id="rank-indicator">
                <i class="fas fa-crown"></i>
                <span id="rank-text">Rang I</span>
            </div>

            <div class="status-indicator" id="time-indicator">
                <i class="far fa-clock"></i>
                <span id="time-text">00:00:00</span>
            </div>

            <div class="status-indicator" id="fps-indicator">
                <i class="fas fa-gamepad"></i>
                <span id="fps-text">60 FPS</span>
            </div>
        </div>

        <!-- Couche 2 : Éléments contextuels -->
        <div class="hud-layer" id="hud-contextual">
            <!-- Menu radial (apparaît au clic droit) -->
            <div id="radial-menu">
                <div class="radial-center">
                    <i class="fas fa-cog"></i>
                </div>
                <!-- Items générés dynamiquement -->
            </div>

            <!-- Tooltips -->
            <div class="hud-tooltip" id="global-tooltip">
                <div class="tooltip-title" id="tooltip-title"></div>
                <div class="tooltip-content" id="tooltip-content"></div>
            </div>

            <!-- Menu contextuel -->
            <div class="context-menu" id="context-menu">
                <!-- Items générés dynamiquement -->
            </div>
        </div>

        <!-- Couche 3 : Éléments temporaires -->
        <div class="hud-layer" id="hud-temporary">
            <!-- Zone de notifications -->
            <div id="notifications-container"></div>

            <!-- Alertes critiques -->
            <div id="critical-alerts"></div>
        </div>

        <!-- Couche 4 : Éléments interactifs -->
        <div class="hud-layer" id="hud-interactive">
            <!-- Barre d'actions inférieure -->
            <div id="action-bar">
                <div class="action-btn" id="btn-build" title="Construction (B)">
                    <i class="fas fa-hammer"></i>
                    <span>Build</span>
                </div>
                <div class="action-btn" id="btn-research" title="Recherche (R)">
                    <i class="fas fa-flask"></i>
                    <span>Research</span>
                </div>
                <div class="action-btn" id="btn-upgrade" title="Améliorations (U)">
                    <i class="fas fa-cogs"></i>
                    <span>Upgrade</span>
                </div>
                <div class="action-btn" id="btn-stats" title="Statistiques (S)">
                    <i class="fas fa-chart-bar"></i>
                    <span>Stats</span>
                </div>
                <div class="action-btn" id="btn-missions" title="Missions (M)">
                    <i class="fas fa-tasks"></i>
                    <span>Missions</span>
                </div>
                <div class="action-btn" id="btn-map" title="Carte (Tab)">
                    <i class="fas fa-map"></i>
                    <span>Map</span>
                </div>
                <div class="action-btn" id="btn-save" title="Sauvegarder (F5)">
                    <i class="fas fa-save"></i>
                    <span>Save</span>
                </div>
                <div class="action-btn" id="btn-menu" title="Menu (Esc)">
                    <i class="fas fa-bars"></i>
                    <span>Menu</span>
                </div>
            </div>

            <!-- Console holographique -->
            <div id="holo-console">
                <div class="console-line">
                    <span class="console-time">[00:00:00]</span>
                    <span>Système HUD initialisé...</span>
                </div>
            </div>

            <!-- Panel latéral d'informations -->
            <div id="info-panel">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <i class="fas fa-info-circle"></i> VUE D'ENSEMBLE
                    </h3>
                    <div class="widget-minimize" title="Minimiser">
                        <i class="fas fa-minus"></i>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-label">Machines actives</div>
                        <div class="stat-value" id="stat-machines">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Production totale</div>
                        <div class="stat-value" id="stat-production">0/s</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Efficacité</div>
                        <div class="stat-value" id="stat-efficiency">100%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Entropie</div>
                        <div class="stat-value" id="stat-entropy">0%</div>
                    </div>
                </div>
            </div>

            <!-- Widgets flottants -->
            <div class="hud-widget" id="production-widget">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <i class="fas fa-industry"></i> PRODUCTION
                    </h3>
                    <div class="widget-minimize" title="Minimiser">
                        <i class="fas fa-minus"></i>
                    </div>
                </div>
                <div id="production-stats">
                    <!-- Données de production dynamiques -->
                </div>
            </div>

            <div class="hud-widget" id="alerts-widget">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <i class="fas fa-exclamation-triangle"></i> ALERTES
                    </h3>
                    <div class="widget-minimize" title="Minimiser">
                        <i class="fas fa-minus"></i>
                    </div>
                </div>
                <div id="alerts-list">
                    <!-- Alertes dynamiques -->
                </div>
            </div>

            <div class="hud-widget" id="objectives-widget">
                <div class="panel-header">
                    <h3 class="panel-title">
                        <i class="fas fa-flag-checkered"></i> OBJECTIFS
                    </h3>
                    <div class="widget-minimize" title="Minimiser">
                        <i class="fas fa-minus"></i>
                    </div>
                </div>
                <div id="objectives-list">
                    <!-- Objectifs dynamiques -->
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal -->
    <script>
        // ============================================
        // CLASSE PRINCIPALE DU JEU
        // ============================================
        class QuantumFactoryTycoon {
            constructor() {
                this.initCanvas();
                this.initHUD();
                this.initGameState();
                this.initEventListeners();
                this.initQuantumBackground();
                this.startGameLoop();
            }

            // ============================================
            // INITIALISATION DU CANVAS
            // ============================================
            initCanvas() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            // ============================================
            // INITIALISATION DU HUD
            // ============================================
            initHUD() {
                this.hudElements = {
                    resources: {},
                    systems: {},
                    widgets: {},
                    indicators: {}
                };

                this.initResourceBar();
                this.initSystemHealth();
                this.initInfoPanel();
                this.initWidgets();
                this.initIndicators();
                this.initConsole();
                this.initTooltips();
            }

            initResourceBar() {
                const resources = [
                    { id: 'matter', name: 'Matière', icon: '🧱', color: '#00f3ff', value: 100, rate: 0, capacity: 1000 },
                    { id: 'energy', name: 'Énergie', icon: '⚡', color: '#ffcc00', value: 50, rate: 0, capacity: 500 },
                    { id: 'quantum', name: 'Quantique', icon: '🔮', color: '#8a2be2', value: 0, rate: 0, capacity: 100 },
                    { id: 'entropy', name: 'Entropie', icon: '🌀', color: '#ff4757', value: 0, rate: 0.1, max: 100 }
                ];

                const container = document.getElementById('resource-bar');
                container.innerHTML = '';

                resources.forEach(res => {
                    const div = document.createElement('div');
                    div.className = 'resource-item';
                    div.id = `resource-${res.id}`;
                    div.innerHTML = `
                        <div class="resource-icon" style="color: ${res.color}; background: ${res.color}20;">
                            ${res.icon}
                        </div>
                        <div class="resource-info">
                            <div class="resource-name">${res.name}</div>
                            <div class="resource-value" style="color: ${res.color}">
                                <span id="${res.id}-value">${res.value}</span>/${res.capacity || res.max}
                            </div>
                            <div class="resource-rate" id="${res.id}-rate">${res.rate >= 0 ? '+' : ''}${res.rate.toFixed(1)}/s</div>
                        </div>
                    `;
                    container.appendChild(div);

                    this.hudElements.resources[res.id] = {
                        element: div,
                        value: res.value,
                        rate: res.rate,
                        capacity: res.capacity || res.max
                    };
                });
            }

            initSystemHealth() {
                this.hudElements.systems.heat = {
                    value: 0,
                    max: 150,
                    element: document.getElementById('heat-value'),
                    bar: document.getElementById('heat-bar')
                };

                this.hudElements.systems.stability = {
                    value: 100,
                    max: 100,
                    element: document.getElementById('stability-value'),
                    bar: document.getElementById('stability-bar')
                };
            }

            initInfoPanel() {
                this.hudElements.stats = {
                    machines: document.getElementById('stat-machines'),
                    production: document.getElementById('stat-production'),
                    efficiency: document.getElementById('stat-efficiency'),
                    entropy: document.getElementById('stat-entropy')
                };
            }

            initWidgets() {
                // Production Widget
                const productionStats = document.getElementById('production-stats');
                productionStats.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-label">Matière/s</div>
                        <div class="stat-value" id="prod-matter">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Énergie/s</div>
                        <div class="stat-value" id="prod-energy">0</div>
                    </div>
                `;

                // Widget de minimisation
                document.querySelectorAll('.widget-minimize').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const widget = e.target.closest('.hud-widget');
                        const isMinimized = widget.classList.contains('minimized');
                        
                        if (isMinimized) {
                            widget.classList.remove('minimized');
                            widget.style.height = 'auto';
                            btn.innerHTML = '<i class="fas fa-minus"></i>';
                        } else {
                            widget.classList.add('minimized');
                            widget.style.height = '40px';
                            btn.innerHTML = '<i class="fas fa-plus"></i>';
                        }
                    });
                });
            }

            initIndicators() {
                this.hudElements.indicators = {
                    rank: document.getElementById('rank-text'),
                    time: document.getElementById('time-text'),
                    fps: document.getElementById('fps-text')
                };

                this.gameTime = 0;
                this.fps = 0;
                this.lastFpsUpdate = Date.now();
                this.frameCount = 0;
            }

            initConsole() {
                this.console = document.getElementById('holo-console');
                this.consoleMessages = [];
                this.maxConsoleLines = 20;

                // Défilement automatique
                this.console.addEventListener('mousewheel', (e) => {
                    e.stopPropagation();
                });
            }

            initTooltips() {
                this.tooltip = document.getElementById('global-tooltip');
                
                // Tooltip sur les éléments HUD
                document.querySelectorAll('[title]').forEach(element => {
                    element.addEventListener('mouseenter', (e) => {
                        this.showTooltip(e.target.title, e.target);
                    });
                    
                    element.addEventListener('mouseleave', () => {
                        this.hideTooltip();
                    });
                });
            }

            // ============================================
            // ÉTAT DU JEU
            // ============================================
            initGameState() {
                this.gameState = {
                    resources: {
                        matter: { value: 100, rate: 2.5, capacity: 1000 },
                        energy: { value: 50, rate: 1.2, capacity: 500 },
                        quantum: { value: 0, rate: 0.1, capacity: 100 },
                        entropy: { value: 0, rate: 0.05, max: 100 }
                    },
                    stats: {
                        machines: 0,
                        production: 0,
                        efficiency: 100,
                        rank: 1,
                        heat: 0,
                        stability: 100
                    },
                    time: {
                        start: Date.now(),
                        elapsed: 0
                    },
                    objectives: [
                        { id: 1, text: "Placer 3 extracteurs", progress: 0, total: 3, completed: false },
                        { id: 2, text: "Atteindre 50 matière", progress: 0, total: 50, completed: false },
                        { id: 3, text: "Maintenir l'entropie < 30%", progress: 100, total: 30, completed: true }
                    ]
                };
            }

            // ============================================
            // FOND QUANTIQUE
            // ============================================
            initQuantumBackground() {
                this.bgContainer = document.getElementById('quantum-bg');
                this.createParticles(50);
            }

            createParticles(count) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'quantum-particle';
                    
                    const size = Math.random() * 4 + 1;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${Math.random() * 100}%`;
                    particle.style.top = `${Math.random() * 100}%`;
                    particle.style.backgroundColor = i % 3 === 0 ? '#00f3ff' : 
                                                   i % 3 === 1 ? '#8a2be2' : '#00ff9d';
                    particle.style.opacity = Math.random() * 0.5 + 0.1;
                    particle.style.animationDuration = `${Math.random() * 20 + 10}s`;
                    particle.style.animationDelay = `${Math.random() * 5}s`;
                    
                    this.bgContainer.appendChild(particle);
                }
            }

            // ============================================
            // GESTION DU HUD
            // ============================================
            updateHUD(deltaTime) {
                this.updateResources(deltaTime);
                this.updateSystems(deltaTime);
                this.updateIndicators(deltaTime);
                this.updateWidgets();
                this.checkObjectives();
            }

            updateResources(deltaTime) {
                Object.entries(this.gameState.resources).forEach(([key, res]) => {
                    // Mettre à jour les valeurs
                    res.value += res.rate * deltaTime;
                    
                    if (key === 'entropy') {
                        res.value = Math.min(res.value, res.max);
                    } else {
                        res.value = Math.min(res.value, res.capacity);
                        res.value = Math.max(0, res.value);
                    }
                    
                    // Mettre à jour l'affichage
                    const element = this.hudElements.resources[key];
                    if (element) {
                        const valueElement = document.getElementById(`${key}-value`);
                        const rateElement = document.getElementById(`${key}-rate`);
                        
                        if (valueElement) {
                            valueElement.textContent = Math.floor(res.value);
                        }
                        
                        if (rateElement) {
                            rateElement.textContent = `${res.rate >= 0 ? '+' : ''}${res.rate.toFixed(1)}/s`;
                            rateElement.style.color = res.rate >= 0 ? '#00ff9d' : '#ff4757';
                        }
                    }
                });
            }

            updateSystems(deltaTime) {
                // Simuler des changements de température et stabilité
                this.gameState.stats.heat += (Math.random() - 0.5) * deltaTime * 10;
                this.gameState.stats.heat = Math.max(0, Math.min(150, this.gameState.stats.heat));
                
                this.gameState.stats.stability -= this.gameState.resources.entropy.value * deltaTime * 0.1;
                this.gameState.stats.stability = Math.max(0, Math.min(100, this.gameState.stats.stability));
                
                // Mettre à jour les barres de progression
                const heatPercent = (this.gameState.stats.heat / 150) * 100;
                const stabilityPercent = this.gameState.stats.stability;
                
                this.hudElements.systems.heat.element.textContent = `${Math.floor(this.gameState.stats.heat)}°C`;
                this.hudElements.systems.heat.bar.style.width = `${heatPercent}%`;
                
                this.hudElements.systems.stability.element.textContent = `${Math.floor(stabilityPercent)}%`;
                this.hudElements.systems.stability.bar.style.width = `${stabilityPercent}%`;
                
                // Changer la couleur en fonction de la valeur
                if (this.gameState.stats.heat > 100) {
                    this.hudElements.systems.heat.bar.style.background = 'linear-gradient(90deg, #ffcc00, #ff4757)';
                } else if (this.gameState.stats.heat > 50) {
                    this.hudElements.systems.heat.bar.style.background = 'linear-gradient(90deg, #00ff9d, #ffcc00)';
                }
            }

            updateIndicators(deltaTime) {
                // Mettre à jour le temps de jeu
                this.gameTime += deltaTime;
                const hours = Math.floor(this.gameTime / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((this.gameTime % 3600) / 60).toString().padStart(2, '0');
                const seconds = Math.floor(this.gameTime % 60).toString().padStart(2, '0');
                
                this.hudElements.indicators.time.textContent = `${hours}:${minutes}:${seconds}`;
                
                // Mettre à jour le rang
                this.hudElements.indicators.rank.textContent = `Rang ${this.gameState.stats.rank}`;
                
                // Calculer FPS
                this.frameCount++;
                const now = Date.now();
                if (now - this.lastFpsUpdate > 1000) {
                    this.fps = Math.round((this.frameCount * 1000) / (now - this.lastFpsUpdate));
                    this.frameCount = 0;
                    this.lastFpsUpdate = now;
                    
                    this.hudElements.indicators.fps.textContent = `${this.fps} FPS`;
                }
            }

            updateWidgets() {
                // Mettre à jour les statistiques du panel
                this.hudElements.stats.machines.textContent = this.gameState.stats.machines;
                this.hudElements.stats.production.textContent = `${this.gameState.resources.matter.rate.toFixed(1)}/s`;
                this.hudElements.stats.efficiency.textContent = `${Math.floor(this.gameState.stats.efficiency)}%`;
                this.hudElements.stats.entropy.textContent = `${Math.floor((this.gameState.resources.entropy.value / this.gameState.resources.entropy.max) * 100)}%`;
                
                // Mettre à jour les widgets de production
                document.getElementById('prod-matter').textContent = this.gameState.resources.matter.rate.toFixed(1);
                document.getElementById('prod-energy').textContent = this.gameState.resources.energy.rate.toFixed(1);
                
                // Mettre à jour la liste des objectifs
                this.updateObjectivesList();
                
                // Vérifier les alertes
                this.checkAlerts();
            }

            updateObjectivesList() {
                const container = document.getElementById('objectives-list');
                if (!container) return;
                
                container.innerHTML = this.gameState.objectives.map(obj => `
                    <div class="stat-item" style="margin-bottom: 8px; ${obj.completed ? 'opacity: 0.7;' : ''}">
                        <div class="stat-label">${obj.text}</div>
                        <div class="stat-value">
                            ${obj.completed ? '✓' : `${Math.min(obj.progress, obj.total)}/${obj.total}`}
                        </div>
                    </div>
                `).join('');
            }

            checkAlerts() {
                const alerts = [];
                
                if (this.gameState.stats.heat > 100) {
                    alerts.push({
                        type: 'danger',
                        icon: '🔥',
                        message: 'Température critique !',
                        details: `Température: ${Math.floor(this.gameState.stats.heat)}°C`
                    });
                }
                
                if (this.gameState.resources.entropy.value > 70) {
                    alerts.push({
                        type: 'warning',
                        icon: '🌀',
                        message: 'Entropie élevée',
                        details: `${Math.floor((this.gameState.resources.entropy.value / this.gameState.resources.entropy.max) * 100)}%`
                    });
                }
                
                if (this.gameState.resources.matter.value < 20) {
                    alerts.push({
                        type: 'warning',
                        icon: '🧱',
                        message: 'Matière faible',
                        details: `${Math.floor(this.gameState.resources.matter.value)} restant`
                    });
                }
                
                this.updateAlertsList(alerts);
            }

            updateAlertsList(alerts) {
                const container = document.getElementById('alerts-list');
                if (!container) return;
                
                if (alerts.length === 0) {
                    container.innerHTML = '<div style="text-align: center; padding: 20px; opacity: 0.5;">Aucune alerte</div>';
                    return;
                }
                
                container.innerHTML = alerts.map(alert => `
                    <div class="alert-item" style="border-left-color: ${alert.type === 'danger' ? '#ff4757' : '#ffcc00'}">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                            <span style="font-size: 14px;">${alert.icon}</span>
                            <span style="font-weight: 600;">${alert.message}</span>
                        </div>
                        <div style="font-size: 11px; opacity: 0.8;">${alert.details}</div>
                    </div>
                `).join('');
            }

            checkObjectives() {
                this.gameState.objectives.forEach(obj => {
                    if (!obj.completed) {
                        // Simuler la progression
                        if (obj.id === 1) {
                            obj.progress = Math.min(obj.total, obj.progress + Math.random() * 0.1);
                        } else if (obj.id === 2) {
                            obj.progress = Math.min(obj.total, this.gameState.resources.matter.value);
                        }
                        
                        if (obj.progress >= obj.total) {
                            obj.completed = true;
                            this.showNotification('Objectif atteint !', `✓ ${obj.text}`, 'success');
                        }
                    }
                });
            }

            // ============================================
            // OUTILS DU HUD
            // ============================================
            showTooltip(text, target) {
                if (!text) return;
                
                const rect = target.getBoundingClientRect();
                this.tooltip.style.left = `${rect.right + 10}px`;
                this.tooltip.style.top = `${rect.top}px`;
                this.tooltip.querySelector('#tooltip-title').textContent = text.split(' (')[0];
                this.tooltip.querySelector('#tooltip-content').textContent = text.includes('(') ? 
                    `Raccourci: ${text.match(/\(([^)]+)\)/)[1]}` : 
                    'Survolez pour plus d\'infos';
                this.tooltip.style.opacity = '1';
            }

            hideTooltip() {
                this.tooltip.style.opacity = '0';
            }

            showNotification(title, message, type = 'info') {
                const container = document.getElementById('notifications-container');
                const notification = document.createElement('div');
                notification.className = `notification`;
                
                let icon = 'ℹ️';
                let borderColor = '#00f3ff';
                
                switch(type) {
                    case 'success':
                        icon = '✅';
                        borderColor = '#00ff9d';
                        break;
                    case 'warning':
                        icon = '⚠️';
                        borderColor = '#ffcc00';
                        break;
                    case 'danger':
                        icon = '🚨';
                        borderColor = '#ff4757';
                        break;
                }
                
                notification.style.borderLeftColor = borderColor;
                notification.innerHTML = `
                    <div class="notification-header">
                        <div class="notification-title">
                            ${icon} ${title}
                        </div>
                        <div class="notification-time">
                            ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        </div>
                    </div>
                    <div class="notification-content">
                        ${message}
                    </div>
                `;
                
                container.appendChild(notification);
                
                // Supprimer après l'animation
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 5000);
            }

            addConsoleMessage(message, type = 'info') {
                const time = new Date();
                const timeStr = `[${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}:${time.getSeconds().toString().padStart(2, '0')}]`;
                
                const line = document.createElement('div');
                line.className = 'console-line';
                
                let color = '#00f3ff';
                switch(type) {
                    case 'error': color = '#ff4757'; break;
                    case 'warning': color = '#ffcc00'; break;
                    case 'success': color = '#00ff9d'; break;
                }
                
                line.innerHTML = `
                    <span class="console-time" style="color: ${color}">${timeStr}</span>
                    <span style="color: ${color}">${message}</span>
                `;
                
                this.console.appendChild(line);
                
                // Limiter le nombre de lignes
                while (this.console.children.length > this.maxConsoleLines) {
                    this.console.removeChild(this.console.firstChild);
                }
                
                // Faire défiler automatiquement
                this.console.scrollTop = this.console.scrollHeight;
                
                // Garder en mémoire
                this.consoleMessages.push({ time: timeStr, message, type });
                if (this.consoleMessages.length > 100) {
                    this.consoleMessages.shift();
                }
            }

            // ============================================
            // GESTION DES ÉVÉNEMENTS
            // ============================================
            initEventListeners() {
                // Boutons d'action
                document.getElementById('btn-build').addEventListener('click', () => {
                    this.showNotification('Mode Construction', 'Sélectionnez une machine à placer', 'info');
                    this.addConsoleMessage('Mode construction activé');
                });
                
                document.getElementById('btn-research').addEventListener('click', () => {
                    this.showNotification('Laboratoire de Recherche', 'Nouvelles technologies disponibles', 'success');
                    this.addConsoleMessage('Accès au laboratoire de recherche');
                });
                
                document.getElementById('btn-save').addEventListener('click', () => {
                    this.saveGame();
                });
                
                document.getElementById('btn-menu').addEventListener('click', () => {
                    this.showRadialMenu(window.innerWidth / 2, window.innerHeight / 2);
                });
                
                // Clic droit pour le menu contextuel
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.showContextMenu(e.clientX, e.clientY);
                });
                
                // Clic pour fermer les menus
                document.addEventListener('click', () => {
                    this.hideRadialMenu();
                    this.hideContextMenu();
                });
                
                // Raccourcis clavier
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'b':
                        case 'B':
                            document.getElementById('btn-build').click();
                            break;
                        case 'r':
                        case 'R':
                            document.getElementById('btn-research').click();
                            break;
                        case 'F5':
                            e.preventDefault();
                            this.saveGame();
                            break;
                        case 'Escape':
                            this.hideAllMenus();
                            break;
                        case 'h':
                        case 'H':
                            this.toggleHUDMode();
                            break;
                    }
                });
                
                // Simulation d'événements de jeu
                setInterval(() => {
                    this.simulateGameEvents();
                }, 5000);
            }

            simulateGameEvents() {
                const events = [
                    { 
                        type: 'production', 
                        message: 'Production de matière optimisée', 
                        effect: () => this.gameState.resources.matter.rate += 0.5 
                    },
                    { 
                        type: 'entropy', 
                        message: 'Fluctuation quantique détectée', 
                        effect: () => this.gameState.resources.entropy.value += 10 
                    },
                    { 
                        type: 'research', 
                        message: 'Nouvelle technologie disponible', 
                        effect: () => this.gameState.resources.quantum.rate += 0.2 
                    }
                ];
                
                const event = events[Math.floor(Math.random() * events.length)];
                event.effect();
                this.addConsoleMessage(event.message, event.type === 'entropy' ? 'warning' : 'info');
                
                if (Math.random() < 0.3) {
                    this.showNotification('Événement système', event.message, 
                        event.type === 'entropy' ? 'warning' : 'info');
                }
            }

            // ============================================
            // MENUS
            // ============================================
            showRadialMenu(x, y) {
                const menu = document.getElementById('radial-menu');
                menu.style.display = 'block';
                menu.style.left = `${x}px`;
                menu.style.top = `${y}px`;
                
                const items = [
                    { icon: 'fas fa-hammer', label: 'Construire', angle: 0 },
                    { icon: 'fas fa-flask', label: 'Recherche', angle: 45 },
                    { icon: 'fas fa-cogs', label: 'Améliorer', angle: 90 },
                    { icon: 'fas fa-chart-bar', label: 'Stats', angle: 135 },
                    { icon: 'fas fa-cog', label: 'Options', angle: 180 },
                    { icon: 'fas fa-save', label: 'Sauvegarder', angle: 225 },
                    { icon: 'fas fa-question', label: 'Aide', angle: 270 },
                    { icon: 'fas fa-times', label: 'Fermer', angle: 315 }
                ];
                
                const radius = 100;
                menu.innerHTML = '<div class="radial-center"><i class="fas fa-cog"></i></div>';
                
                items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'radial-item';
                    itemDiv.style.left = `${radius * Math.cos(item.angle * Math.PI / 180)}px`;
                    itemDiv.style.top = `${radius * Math.sin(item.angle * Math.PI / 180)}px`;
                    itemDiv.innerHTML = `<i class="${item.icon}"></i>`;
                    itemDiv.title = item.label;
                    
                    itemDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.addConsoleMessage(`${item.label} sélectionné`);
                        this.showNotification('Action', item.label, 'info');
                        this.hideRadialMenu();
                    });
                    
                    menu.appendChild(itemDiv);
                });
            }

            hideRadialMenu() {
                document.getElementById('radial-menu').style.display = 'none';
            }

            showContextMenu(x, y) {
                const menu = document.getElementById('context-menu');
                menu.style.left = `${x}px`;
                menu.style.top = `${y}px`;
                menu.style.display = 'block';
                
                menu.innerHTML = `
                    <div class="menu-item">
                        <i class="fas fa-info-circle"></i>
                        <span>Informations</span>
                    </div>
                    <div class="menu-item">
                        <i class="fas fa-edit"></i>
                        <span>Modifier</span>
                    </div>
                    <div class="menu-item">
                        <i class="fas fa-trash"></i>
                        <span>Supprimer</span>
                    </div>
                    <div class="menu-item">
                        <i class="fas fa-sync-alt"></i>
                        <span>Actualiser</span>
                    </div>
                `;
                
                // Ajouter les événements
                menu.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const action = item.querySelector('span').textContent;
                        this.addConsoleMessage(`Action contexte: ${action}`);
                        menu.style.display = 'none';
                    });
                });
            }

            hideContextMenu() {
                document.getElementById('context-menu').style.display = 'none';
            }

            hideAllMenus() {
                this.hideRadialMenu();
                this.hideContextMenu();
            }

            toggleHUDMode() {
                const overlay = document.getElementById('hud-overlay');
                const modes = ['default', 'hud-mode-minimal', 'hud-mode-immersive'];
                const current = modes.find(mode => overlay.classList.contains(mode)) || 'default';
                const next = modes[(modes.indexOf(current) + 1) % modes.length];
                
                overlay.classList.remove(...modes);
                if (next !== 'default') {
                    overlay.classList.add(next);
                }
                
                this.addConsoleMessage(`Mode HUD: ${next.replace('hud-mode-', '')}`);
                this.showNotification('Interface', `Mode ${next.replace('hud-mode-', '')} activé`, 'info');
            }

            // ============================================
            // SAUVEGARDE
            // ============================================
            saveGame() {
                const saveData = {
                    gameState: this.gameState,
                    consoleMessages: this.consoleMessages,
                    timestamp: Date.now(),
                    version: '1.0'
                };
                
                const compressed = LZString.compressToUTF16(JSON.stringify(saveData));
                localStorage.setItem('qft_hud_save', compressed);
                
                this.addConsoleMessage('Partie sauvegardée avec succès', 'success');
                this.showNotification('Sauvegarde', 'Progression enregistrée', 'success');
                
                // Téléchargement optionnel
                const blob = new Blob([compressed], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `qft_save_${Date.now()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            loadGame() {
                const saveData = localStorage.getItem('qft_hud_save');
                if (!saveData) {
                    this.addConsoleMessage('Aucune sauvegarde trouvée', 'warning');
                    return;
                }
                
                try {
                    const decompressed = LZString.decompressFromUTF16(saveData);
                    const data = JSON.parse(decompressed);
                    
                    this.gameState = data.gameState;
                    this.consoleMessages = data.consoleMessages || [];
                    
                    this.addConsoleMessage('Partie chargée avec succès', 'success');
                    this.showNotification('Chargement', 'Progression restaurée', 'success');
                } catch (error) {
                    this.addConsoleMessage('Erreur de chargement de la sauvegarde', 'error');
                }
            }

            // ============================================
            // BOUCLE DE JEU
            // ============================================
            startGameLoop() {
                let lastTime = 0;
                
                const gameLoop = (currentTime) => {
                    const deltaTime = Math.min(0.1, (currentTime - lastTime) / 1000);
                    lastTime = currentTime;
                    
                    // Mettre à jour le jeu
                    this.updateHUD(deltaTime);
                    
                    // Rendu (simplifié pour cet exemple)
                    this.render();
                    
                    requestAnimationFrame(gameLoop);
                };
                
                // Message de bienvenue
                setTimeout(() => {
                    this.addConsoleMessage('=== SYSTÈME QUANTIQUE ACTIVÉ ===', 'success');
                    this.addConsoleMessage('Interface HUD complète initialisée');
                    this.addConsoleMessage('Utilisez B pour construire, R pour la recherche');
                    this.addConsoleMessage('Clic droit pour le menu contextuel, H pour changer de mode HUD');
                    
                    this.showNotification('Bienvenue', 'Quantum Factory Tycoon chargé', 'success');
                }, 1000);
                
                requestAnimationFrame(gameLoop);
            }

            render() {
                // Nettoyer le canvas
                this.ctx.fillStyle = 'rgba(10, 5, 30, 0.1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Ici on pourrait dessiner la grille de jeu, les machines, etc.
                // Pour cet exemple, on dessine juste un effet de fond
                this.drawGrid();
            }

            drawGrid() {
                const gridSize = 50;
                const offsetX = (Date.now() / 10000) % gridSize;
                const offsetY = (Date.now() / 10000) % gridSize;
                
                this.ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
                this.ctx.lineWidth = 1;
                
                // Lignes verticales
                for (let x = -offsetX; x < this.canvas.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                
                // Lignes horizontales
                for (let y = -offsetY; y < this.canvas.height; y += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }
                
                // Points de grille
                this.ctx.fillStyle = 'rgba(0, 243, 255, 0.1)';
                for (let x = gridSize/2 - offsetX; x < this.canvas.width; x += gridSize) {
                    for (let y = gridSize/2 - offsetY; y < this.canvas.height; y += gridSize) {
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, 1, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
            }
        }

        // ============================================
        // INITIALISATION
        // ============================================
        let game;

        window.addEventListener('load', () => {
            game = new QuantumFactoryTycoon();
            
            // Charger une sauvegarde si disponible
            setTimeout(() => {
                const saveData = localStorage.getItem('qft_hud_save');
                if (saveData) {
                    if (confirm('Une sauvegarde a été trouvée. Voulez-vous la charger ?')) {
                        game.loadGame();
                    }
                }
            }, 2000);
        });

        // Exposer globalement pour le débogage
        window.game = game;
    </script>
</body>
</html>
